<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".95"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".95"/></linearGradient><style>@keyframes pulse{0%{transform:scale(1);opacity:.2}}@keyframes float{0%{transform:translate(80px,50px)}}.badge-text,.subfooter-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:38px;fill:url(#textGrad)}.subtitle{font-weight:500;font-size:19px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#f8fafc}.subfooter-text{font-size:14px;font-weight:500;fill:#94a3b8}.pulse-circle{animation:pulse 4s ease-in-out infinite alternate;transform-origin:center}.float-card{animation:float 4s ease-in-out infinite alternate}.dash-flow{stroke-dasharray:10,10;animation:dash 20s linear infinite}</style></defs><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><circle cx="150" cy="100" r="160" fill="#6366f1" class="pulse-circle" opacity=".3"/><circle cx="1050" cy="300" r="180" fill="#a855f7" class="pulse-circle" opacity=".3" style="animation-delay:-2s"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 150 250 Q 300 120 450 250 T 750 250 T 1050 250" class="dash-flow" opacity=".4"/><path fill="none" stroke="#c084fc" stroke-width="2" d="M 200 150 Q 500 320 800 150 T 1100 200" class="dash-flow" opacity=".3" style="animation-duration:15s"/><g class="float-card" transform="translate(80, 50)"><rect width="1040" height="300" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" rx="16"/><g transform="translate(45, 38)"><rect width="64" height="64" fill="#38bdf8" fill-opacity=".15" stroke="#38bdf8" stroke-opacity=".3" stroke-width="1.5" rx="14"/><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M 16 22 L 32 13 L 48 22 L 48 42 L 32 51 L 16 42 Z"/><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M 16 22 L 32 31 L 48 22"/><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M 32 31 L 32 51"/></g><text x="130" y="74" class="title">Awesome Purchase Order Management</text><text x="130" y="108" class="subtitle">Curated SaaS Platforms &amp; Open-Source Procure-to-Pay Ecosystem</text><g><g transform="translate(45, 155) translate(0, 0)"><rect width="215" height="42" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="21"/><text x="107.5" y="26" class="badge-text" text-anchor="middle">Purchase Requisitions</text></g><g transform="translate(45, 155) translate(230, 0)"><rect width="195" height="42" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" rx="21"/><text x="97.5" y="26" class="badge-text" text-anchor="middle">Approval Workflows</text></g><g transform="translate(45, 155) translate(440, 0)"><rect width="165" height="42" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" rx="21"/><text x="82.5" y="26" class="badge-text" text-anchor="middle">Spend Control</text></g><g transform="translate(45, 155) translate(620, 0)"><rect width="215" height="42" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" rx="21"/><text x="107.5" y="26" class="badge-text" text-anchor="middle">Supplier Coordination</text></g></g><g><g transform="translate(45, 245) translate(0, 0)"><circle cx="6" cy="6" r="4" fill="#38bdf8"/><text x="20" y="10" class="subfooter-text">9 SaaS Leaders Evaluated</text></g><g transform="translate(45, 245) translate(260, 0)"><circle cx="6" cy="6" r="4" fill="#a855f7"/><text x="20" y="10" class="subfooter-text">Best Open-Source ERP Modules</text></g><g transform="translate(45, 245) translate(560, 0)"><circle cx="6" cy="6" r="4" fill="#4ade80"/><text x="20" y="10" class="subfooter-text">Star Ratings &amp; Pricing Benchmarks</text></g></g></g></svg>